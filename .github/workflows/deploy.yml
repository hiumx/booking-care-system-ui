name: Production CI/CD

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    NODE_VERSION: 20.19.3

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: ⬇️ Checkout code
              uses: actions/checkout@v4

            - name: 🔧 Set up Node.js ${{ env.NODE_VERSION }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'npm'

            - name: 📦 Install dependencies
              run: npm ci

            - name: 🔍 Run linting
              run: npm run lint

            - name: 📝 Check formatting
              run: npm run format:check

            - name: 🧪 Run type checking
              run: npx tsc --noEmit

            - name: ✅ Run tests
              run: npm test --if-present

            - name: 🏗️ Build the project
              run: npm run build
              env:
                  NODE_ENV: production

            - name: 📊 Upload build artifacts
              uses: actions/upload-artifact@v4
              if: success()
              with:
                  name: production-build-${{ github.sha }}
                  path: dist/
                  retention-days: 30

            - name: 📝 Comment on PR
              uses: actions/github-script@v7
              if: github.event_name == 'pull_request' && success()
              with:
                  script: |
                      github.rest.issues.createComment({
                          issue_number: context.issue.number,
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          body: '✅ Production build completed successfully! Ready for merge to main.'
                      })

    # Deployment job (only runs on main branch)
    deploy:
        needs: build
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'

        steps:
            - name: 📥 Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: build-files-${{ github.sha }}
                  path: dist/

            - name: 🚀 Deploy to production
              run: |
                  echo "🚀 Deploying to production..."
                  echo "📁 Build files ready in dist/"
                  # Add your deployment commands here
                  # Example: rsync, scp, or deployment to cloud services
